name: Daily LinkedIn draft (approve ahead, posts Mon/Wed/Fri) & TIL Generator

on:
  schedule:
    # Run daily at 13:00 UTC (6:00 AM MST / America/Phoenix timezone)
    - cron: '0 13 * * *'
    # Backup in case GitHub delays or drops the first one; the once_a_day job lets only the first scheduled run of the day draft.
    - cron: '30 17 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab. A preview drafts a brand-new post of the chosen type and shows it on the
    # run page with its image; it skips the approved queue and is never offered for publishing.
    inputs:
      preview:
        description: "Preview a new draft (never posted)"
        type: choice
        default: none
        options: [none, project_spotlight, lesson, decision]
      redraft:
        description: "Started automatically after a rejected draft"
        type: boolean
        default: false
      reject_comment:
        description: "The comment left when rejecting the last draft"
        type: string
        default: ""
      rejected_story:
        description: "The story the rejected draft was written from"
        type: string
        default: ""

jobs:
  once_a_day:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
    - name: Skip if an earlier scheduled run already ran today
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
      run: |
        if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
        today=$(date -u +%F)
        # Earlier scheduled runs today that did not fail or get cancelled (a run waiting for approval counts as done).
        n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily_post.yml/runs?created=${today}&event=schedule&per_page=50"           --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }} and .conclusion != \"failure\" and .conclusion != \"cancelled\")] | length" || echo 0)
        # If the check itself fails, draft anyway: a missed post is worse than a second approval email.
        if [ "${n:-0}" -gt 0 ]; then
          echo "go=false" >> "$GITHUB_OUTPUT"
          echo "An earlier scheduled run already ran today ($today); this backup run does nothing."
        else
          echo "go=true" >> "$GITHUB_OUTPUT"
        fi

  draft:
    needs: once_a_day
    if: ${{ needs.once_a_day.outputs.go == 'true' }}
    # Drafts the day's post (Mon/Wed/Fri) and writes the TIL note. It never posts: LinkedIn's API terms do not allow unattended automated
    # posting, so the publish job below waits for the owner's approval of each draft.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_draft: ${{ steps.run.outputs.has_draft }}
      has_preview: ${{ steps.run.outputs.has_preview }}

    steps:
    - name: Checkout CurioSync
      uses: actions/checkout@v4
      with:
        path: curiosync

    - name: Check the TIL rest window
      # Every year, no TIL notes from Sharad Navratri (Ashwin Shukla Pratipada) until Labh Pancham (Kartik Shukla Panchami); notes resume on
      # Labh Pancham itself. Dates follow the Gujarati (amanta) panchang for Ahmedabad: sunrise tithi, Lahiri ayanamsa, computed with the Swiss
      # Ephemeris and checked against Drik Panchang (2024-2027). LinkedIn posting is not affected. Extend the table before 2041.
      id: til_window
      run: |
        today=$(date -u +%F)
        case "${today:0:4}" in
          2026) start=2026-10-11; resume=2026-11-14 ;;
          2027) start=2027-09-30; resume=2027-11-03 ;;
          2028) start=2028-09-19; resume=2028-10-22 ;;
          2029) start=2029-10-08; resume=2029-11-10 ;;
          2030) start=2030-09-28; resume=2030-10-31 ;;
          2031) start=2031-10-17; resume=2031-11-19 ;;
          2032) start=2032-10-05; resume=2032-11-08 ;;
          2033) start=2033-09-24; resume=2033-10-28 ;;
          2034) start=2034-10-13; resume=2034-11-16 ;;
          2035) start=2035-10-02; resume=2035-11-05 ;;
          2036) start=2036-09-20; resume=2036-10-24 ;;
          2037) start=2037-10-09; resume=2037-11-12 ;;
          2038) start=2038-09-29; resume=2038-11-01 ;;
          2039) start=2039-10-18; resume=2039-11-20 ;;
          2040) start=2040-10-07; resume=2040-11-09 ;;
          *) start=""; resume=""; echo "::warning::No festival rest dates for ${today:0:4}; extend the table in daily_post.yml." ;;
        esac
        if [[ -n "$start" && ! "$today" < "$start" && "$today" < "$resume" ]]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "TIL rest window ($start to the day before $resume): no note today ($today)."
        else
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout dev-root-affinity
      id: checkout_til
      env:
        PAT_DEV_ROOT_AFFINITY: ${{ secrets.PAT_DEV_ROOT_AFFINITY }}
      if: ${{ env.PAT_DEV_ROOT_AFFINITY != '' && steps.til_window.outputs.enabled == 'true' }}
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: Deshraj-Jogiya/dev-root-affinity
        token: ${{ secrets.PAT_DEV_ROOT_AFFINITY }}
        path: dev-root-affinity

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: curiosync/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r curiosync/requirements.txt

    - name: Count drafts already waiting for approval
      # Only one draft waits for approval at a time; runs from before the approve job existed (job "publish") are not counted.
      id: waiting
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        n=0
        for id in $(gh api "repos/${{ github.repository }}/actions/runs?status=waiting&per_page=50" --jq '.workflow_runs[].id' || true); do
          c=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "approve" and .status == "waiting")] | length' || echo 0)
          n=$((n + c))
        done
        echo "count=$n" >> "$GITHUB_OUTPUT"
        echo "Drafts waiting for approval: $n"

    - name: Post today's approved post, draft the next one & write the TIL note
      id: run
      env:
        # Dummy configuration to satisfy Settings schema validations
        SECRET_KEY: "github-actions-dummy-secret-key-placeholder"
        LINKEDIN_CLIENT_ID: "github-actions-dummy-client-id-placeholder"
        LINKEDIN_CLIENT_SECRET: "github-actions-dummy-client-secret-placeholder"
        FERNET_KEY: ${{ secrets.FERNET_KEY }}
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        
        # Real credentials and settings configured in GitHub Repository Secrets
        OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
        OPENAI_MODEL: "gemini-3.5-flash"
        # Free second provider (console.groq.com); used after gemini-3.5-flash. Without the secret only Gemini is used.
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_SUB_URN: ${{ secrets.LINKEDIN_SUB_URN }}
        GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
        PREVIEW_FORMAT: ${{ inputs.preview || 'none' }}
        REDRAFT: ${{ inputs.redraft || false }}
        REJECT_COMMENT: ${{ inputs.reject_comment }}
        REJECTED_STORY: ${{ inputs.rejected_story }}
        GITHUB_TOKEN: ${{ github.token }}
        WAITING_APPROVALS: ${{ steps.waiting.outputs.count }}
      working-directory: curiosync
      run: python -m github_cron draft

    - name: Keep the preview
      if: ${{ steps.run.outputs.has_preview == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: preview-post
        path: curiosync/pending_post
        retention-days: 7

    - name: Keep the draft for the publish job
      if: ${{ steps.run.outputs.has_draft == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: pending-post
        path: curiosync/pending_post
        retention-days: 3

    - name: Put the image where the review page can show it
      # The run summary can only show an image by URL, so the draft's image goes to the previews branch as <run id>.png.
      if: ${{ (steps.run.outputs.has_draft == 'true' || steps.run.outputs.has_preview == 'true') && hashFiles('curiosync/pending_post/image.png') != '' }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        url="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        if git clone -q --depth 1 --branch previews "$url" previews; then cd previews; else
          mkdir -p previews && cd previews && git init -q && git checkout -q -b previews && git remote add origin "$url"; fi
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        cp ../curiosync/pending_post/image.png "${{ github.run_id }}.png"
        git add "${{ github.run_id }}.png"
        git commit -q -m "Preview image for run ${{ github.run_id }} [skip ci]"
        git push -q origin previews

    - name: Commit and push run log
      if: always()
      working-directory: curiosync
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add run_log.md data/post_history.json data/stories.json data/stories.json.tried data/feedback.json || true
        git commit -m "chore: update daily execution log [skip ci]" || true
        git pull --rebase || true
        git push || true

    - name: Commit and push daily TIL
      env:
        PAT_DEV_ROOT_AFFINITY: ${{ secrets.PAT_DEV_ROOT_AFFINITY }}
      # always(): a LinkedIn failure in the step above must not stop an already-written TIL note from being committed
      if: ${{ always() && env.PAT_DEV_ROOT_AFFINITY != '' && steps.til_window.outputs.enabled == 'true' }}
      continue-on-error: true
      working-directory: dev-root-affinity
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add notes/ || true
        if git diff --cached --quiet; then
          echo "No new TIL notes to commit."
        else
          git commit -m "Add daily TIL note [skip ci]"
          git push
        fi

    - name: Fail loudly if no TIL note could be written
      # The checkout above is continue-on-error, so an expired PAT used to skip the TIL silently while the run still showed success.
      if: ${{ always() && steps.til_window.outputs.enabled == 'true' && (inputs.preview || 'none') == 'none' }}
      env:
        CHECKOUT_OUTCOME: ${{ steps.checkout_til.outcome }}
      run: |
        if [ "$CHECKOUT_OUTCOME" != "success" ]; then
          echo "::error::dev-root-affinity checkout failed (outcome: $CHECKOUT_OUTCOME). PAT_DEV_ROOT_AFFINITY is missing, expired, or lacks access, so no TIL note was written."
          exit 1
        fi
        if ! ls dev-root-affinity/notes/til-$(date -u +%F)-*.md >/dev/null 2>&1; then
          echo "::warning::No TIL note dated $(date -u +%F) was written to dev-root-affinity/notes."
        fi

  approve:
    # Waits on the "linkedin-publish" environment, whose required reviewer is the owner. Approving adds the draft to the approved queue
    # for its post day (and posts it at once if that day is today). Rejecting it starts the redraft job below.
    needs: draft
    if: ${{ always() && needs.draft.outputs.has_draft == 'true' }}
    runs-on: ubuntu-latest
    environment: linkedin-publish
    permissions:
      contents: write

    steps:
    - name: Checkout CurioSync
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch the approved draft
      uses: actions/download-artifact@v4
      with:
        name: pending-post
        path: pending_post

    - name: Queue the approved draft for its post day
      env:
        SECRET_KEY: "github-actions-dummy-secret-key-placeholder"
        LINKEDIN_CLIENT_ID: "github-actions-dummy-client-id-placeholder"
        LINKEDIN_CLIENT_SECRET: "github-actions-dummy-client-secret-placeholder"
        FERNET_KEY: ${{ secrets.FERNET_KEY }}
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_SUB_URN: ${{ secrets.LINKEDIN_SUB_URN }}
      run: python -m github_cron approve

    - name: Commit the queue and run log
      if: always()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add run_log.md data/post_history.json data/approved_queue.json assets/approved || true
        git commit -m "Queue an approved post [skip ci]" || true
        for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

  redraft:
    # A rejected draft fails the approve job; this starts a new run that writes another draft for the same post day. It stops on its own
    # when the day's free model quota runs out, since a run that cannot draft offers nothing to reject.
    needs: [draft, approve]
    if: ${{ always() && needs.draft.outputs.has_draft == 'true' && needs.approve.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Fetch the rejected draft
      uses: actions/download-artifact@v4
      with:
        name: pending-post
        path: pending_post

    - name: Start a new draft, passing on the reason for the reject
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        comment=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" --jq '[.[] | select(.state == "rejected")][0].comment // ""' || echo "")
        story=$(python3 -c "import json; print(json.load(open('pending_post/meta.json')).get('story_id') or '')" || echo "")
        gh workflow run daily_post.yml -R "${{ github.repository }}" -f redraft=true -f reject_comment="$comment" -f rejected_story="$story"
